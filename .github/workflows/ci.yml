name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight CI run if a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff format (check only)
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy (app/)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -q

  webapp:
    name: webapp build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci || npm install

      - name: TypeScript typecheck
        working-directory: webapp
        run: npm run typecheck

      - name: Build
        working-directory: webapp
        run: npm run build

  # Informational only: surfaces known vulnerable dependencies on every PR.
  # The audit steps are non-blocking (continue-on-error) so pre-existing
  # transitive advisories cannot wedge all future merges. Review the logs.
  dependency-audit:
    name: dependency audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python
        run: uv python install

      - name: Python dependency audit (pip-audit)
        # Run pip-audit ephemerally via uvx against the locked deps.
        continue-on-error: true
        run: uv export --format requirements-txt --no-emit-project | uvx pip-audit -r /dev/stdin

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: webapp dependency audit (npm audit)
        # npm audit works against the committed lockfile alone.
        continue-on-error: true
        working-directory: webapp
        run: npm audit --audit-level=high
