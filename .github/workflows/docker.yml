name: Docker image

# Собираем образ здесь, а не на сервере. Целевой VPS делит диск с
# другими проектами: локальная сборка тянет node_modules и компиляторы
# (несколько ГБ), а готовый образ занимает меньше гигабайта. На сервере
# остаётся `docker compose pull`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Имя пакета должно совпадать с image в docker-compose.yml.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кэш слоёв в самом реестре: следующая сборка переиспользует
          # неизменившиеся слои (тяжёлый npm ci) вместо повтора с нуля.
          cache-from: type=gha
          cache-to: type=gha,mode=max
