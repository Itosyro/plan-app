# Self-hosted plan-app: один контейнер, никаких внешних сервисов.
#
#   docker compose up -d
#
# Что внутри и почему именно так:
#   • BOT_MODE=polling — бот сам ходит в Telegram исходящими запросами.
#     Не нужен ни домен, ни TLS-сертификат, ни проброс портов наружу.
#   • SQLite-файл в ./data — не нужен ни Postgres-контейнер, ни облачная
#     база. Для одного пользователя это ровно то, что надо.
#   • AUTO_MIGRATE=true — схема БД доводится до актуальной на старте.
#
# Порт 8000 публикуется ТОЛЬКО на localhost (127.0.0.1): наружу торчать
# нечему, а с самой машины можно проверить `curl localhost:8000/healthz`.

services:
  app:
    # Готовый образ собирается в GitHub Actions при каждом пуше в main.
    # На сервере он просто скачивается — это важно: локальная сборка
    # тянет node_modules и компиляторы, которым нужно несколько ГБ.
    image: ghcr.io/itosyro/plan-app:latest
    # Чтобы собрать на месте (нужно ≥4 ГБ свободного диска):
    #   docker compose build
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plan-app
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
      BOT_MODE: polling
      AUTO_MIGRATE: "true"
      DATABASE_URL: sqlite+aiosqlite:////app/data/plan.db
      # Keep-alive нужен только против засыпания бесплатного Render.
      # На своей машине это лишние запросы.
      KEEPALIVE_ENABLED: "false"
    volumes:
      # Единственное, что переживает пересоздание контейнера: база.
      - ./data:/app/data
    ports:
      # По умолчанию порт виден только с самой машины — наружу торчать
      # нечему. Если перед VM стоит прокси провайдера (exe.dev, Fly,
      # Railway: «опубликовать порт N»), он приходит по сетевому
      # интерфейсу, а не через localhost — тогда в .env нужно
      # APP_BIND=0.0.0.0, иначе прокси упрётся в закрытую дверь.
      - "${APP_BIND:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      # Без лимита docker-логи растут бесконечно и однажды забивают
      # диск — на машине с парой свободных гигабайт это вопрос времени.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Маршрутизатор на один публичный порт. Запускается ТОЛЬКО явно:
  #   docker compose --profile router up -d
  # Нужен, когда хостинг публикует один порт, а он уже занят соседним
  # проектом. Подробности и порядок переключения — docs/SELF-HOSTING.md.
  router:
    profiles: ["router"]
    image: caddy:2-alpine
    container_name: plan-app-router
    restart: unless-stopped
    # host-сеть: Caddy занимает порт прямо на машине и ходит к обоим
    # сервисам по 127.0.0.1. Иначе пришлось бы пробрасывать соседний
    # проект внутрь docker-сети, а он про нас ничего не знает.
    network_mode: host
    environment:
      ROUTER_PORT: "${ROUTER_PORT:-3003}"
      PLAN_UPSTREAM: "127.0.0.1:8000"
      NEIGHBOUR_UPSTREAM: "${NEIGHBOUR_UPSTREAM:-127.0.0.1:3002}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
