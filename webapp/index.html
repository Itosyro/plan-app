<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      Override viewport: user-scalable=no prevents iOS WebView from
      intercepting pinch-to-zoom gestures so Excalidraw can handle them.
      viewport-fit=cover keeps the safe-area CSS vars working on notched devices.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>План</title>
    <!--
      Telegram WebApp SDK. Loaded synchronously so `window.Telegram.WebApp`
      is available before our app boot. The script is tiny (~5 KB) and
      cached aggressively by Telegram's clients — no measurable cost.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!--
      Excalidraw asset path: local fonts first, CDN fallback.
      Must be set before the Excalidraw chunk is evaluated.
    -->
    <script>window.EXCALIDRAW_ASSET_PATH = ["/", "https://esm.run/@excalidraw/excalidraw@0.18.1/dist/prod/"];</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
